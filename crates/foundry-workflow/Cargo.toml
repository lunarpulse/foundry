[package]
name = "foundry-workflow"
version.workspace = true
edition.workspace = true

[dependencies]
foundry-domain = { path = "../foundry-domain" }
foundry-ledger = { path = "../foundry-ledger" }
foundry-approval = { path = "../foundry-approval" }
chrono = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
foundry-approval = { path = "../foundry-approval" }
foundry-domain = { path = "../foundry-domain", features = ["proof-fixture"] }
foundry-ledger = { path = "../foundry-ledger" }
chrono = { workspace = true }
sha2 = "0.10"
