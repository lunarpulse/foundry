[package]
name = "foundry"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "foundry"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
foundry-domain = { path = "../foundry-domain" }
foundry-line = { path = "../foundry-line" }
foundry-blueprint = { path = "../foundry-blueprint" }
foundry-ledger = { path = "../foundry-ledger" }
foundry-harness-cli = { path = "../foundry-harness-cli" }
foundry-watch = { path = "../foundry-watch" }
chrono.workspace = true
clap.workspace = true
tokio.workspace = true
foundry-serve = { version = "0.1.0", path = "../foundry-serve" }
axum = "0.8.9"
serde_json.workspace = true

[target.x86_64-unknown-linux-gnu.dependencies]
libc = "0.2.190"
