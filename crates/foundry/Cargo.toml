[package]
name = "foundry"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
p2-test-support = ["foundry-ledger/p2-test-support", "foundry-line/p2-test-support", "foundry-serve/p2-test-support"]

[[bin]]
name = "foundry"
path = "src/main.rs"

[[test]]
name = "b1_publish_cli"
path = "tests/b1_publish_cli.rs"
required-features = ["p2-test-support"]

[[test]]
name = "b1_publish_cli_default"
path = "tests/b1_publish_cli_default.rs"

[dependencies]
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
foundry-domain = { path = "../foundry-domain" }
foundry-orch = { path = "../foundry-orch" }
foundry-approval = { path = "../foundry-approval" }
foundry-workflow = { path = "../foundry-workflow" }
foundry-line = { path = "../foundry-line" }
foundry-exec = { path = "../foundry-exec" }
foundry-blueprint = { path = "../foundry-blueprint" }
foundry-ledger = { path = "../foundry-ledger" }
foundry-harness-cli = { path = "../foundry-harness-cli" }
foundry-watch = { path = "../foundry-watch" }
chrono.workspace = true
clap.workspace = true
tokio.workspace = true
foundry-serve = { version = "0.1.0", path = "../foundry-serve" }
axum = "0.8.9"
serde_json.workspace = true
serde.workspace = true
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[dev-dependencies]
rusqlite.workspace = true

[target.x86_64-unknown-linux-gnu.dependencies]
libc = "0.2.190"
