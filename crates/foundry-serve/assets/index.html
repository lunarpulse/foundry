<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Foundry — UI-0</title>
<style>
  :root { --bg:#0f1115; --card:#1a1f29; --line:#2a3242; --txt:#d7dde8; --dim:#8b94a7; --acc:#5ba3f5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 ui-monospace,Menlo,Consolas,monospace; }
  header { display:flex; gap:16px; align-items:baseline; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  #meta { color:var(--dim); font-size:12px; }
  #meta b { color:var(--txt); }
  #verify { font-size:12px; padding:2px 8px; border-radius:10px; }
  .ok { background:#12351f; color:#7ee2a0; } .bad { background:#3b1620; color:#ff8fa3; }
  main { display:flex; gap:12px; padding:16px 20px; overflow-x:auto; min-height:80vh; }
  .col { min-width:210px; flex:1; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .col h2 { font-size:12px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; display:flex; justify-content:space-between; }
  .col h2 .n { color:var(--txt); }
  .card { background:#232b3a; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:8px; cursor:pointer; }
  .card:hover { border-color:var(--acc); }
  .card .oid { font-size:12px; word-break:break-all; }
  .card .ev { color:var(--dim); font-size:11px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.waiting { border-left:3px solid #f5c451; }
  .card.failed, .card.rejected, .card.canceled { border-left:3px solid #ff8fa3; opacity:.85; }
  .card.shipped { border-left:3px solid #7ee2a0; }
  dialog { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:10px; max-width:760px; width:90%; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  pre { background:#10131a; border:1px solid var(--line); border-radius:6px; padding:10px; font-size:11.5px; overflow:auto; max-height:60vh; }
  #banner { display:none; background:#3b2a10; color:#f5c451; padding:6px 20px; font-size:12px; }
  input, button { background:#10131a; color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:8px; font:inherit; }
  button { cursor:pointer; }
  #product-login { max-width:440px; margin:8vh auto; padding:18px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  #product-login form { display:grid; gap:10px; }
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <h1>FOUNDRY ▸ UI-0</h1>
  <span id="meta">loading…</span>
  <span id="verify" class="ok">chain ✓</span>
</header>
<main id="board"></main>
<dialog id="dlg"><div id="dlg-body"></div></dialog>
<script>
const COLS = ["received","queued","working","review","waiting","publishing","shipped","unknown","failed","rejected","canceling","canceled"];
const LABEL = {received:"Received",queued:"Queued",working:"Working",review:"Inspecting",waiting:"FurnaceHold",publishing:"Publishing",shipped:"Shipped",unknown:"Unknown",failed:"Failed",rejected:"Rejected",canceling:"Canceling",canceled:"Canceled"};
let productMode = false;
let productBearer = null; // deliberately memory-only; a reload requires a new login

async function detectProductMode(){
  const response = await fetch("/api/product/session");
  if (response.status === 404) return false;
  productMode = true;
  renderProductLogin();
  return true;
}

function renderProductLogin(message=""){
  const board=document.getElementById("board");
  board.style.display="block";
  board.innerHTML = `<section id="product-login"><h2>Foundry Product</h2><p>Bearer credentials stay in this page's memory. Reloading requires a new login.</p><form id="login-form"><input name="actor_id" autocomplete="username" placeholder="Account" required maxlength="256"><input name="password" type="password" autocomplete="current-password" placeholder="Password" required maxlength="1024"><button>Sign in</button></form><p id="login-error">${esc(message)}</p></section>`;
  document.getElementById("login-form").onsubmit=async e=>{
    e.preventDefault();
    const form=new FormData(e.currentTarget);
    const response=await fetch("/api/product/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({actor_id:form.get("actor_id"),password:form.get("password")})});
    const data=await response.json().catch(()=>({}));
    e.currentTarget.reset();
    if(!response.ok){document.getElementById("login-error").textContent="Authentication failed";return;}
    productBearer=data.access_token;
    showProductUnavailable();
  };
}

function showProductUnavailable(){
  const board=document.getElementById("board"); board.style.display="block";
  board.innerHTML=`<section id="product-login"><h2>Product session active</h2><p>Bearer credentials remain in memory. Refresh this page to sign in again.</p><div id="product-holds">Loading active review holds…</div><button id="refresh-holds">Refresh</button> <button id="logout">Sign out</button><p id="login-error"></p></section>`;
  document.getElementById("refresh-holds").onclick=loadProductHolds;
  loadProductHolds();
  document.getElementById("logout").onclick=async()=>{
    await fetch("/api/product/logout",{method:"POST",headers:{authorization:`Bearer ${productBearer}`}});
    productBearer=null; renderProductLogin("Signed out");
  };
}

async function loadProductHolds(){
  const host=document.getElementById("product-holds"); if(!host||!productBearer)return;
  const response=await fetch("/api/product/review/holds",{headers:{authorization:`Bearer ${productBearer}`}});
  if(!response.ok){host.textContent=response.status===401?"Session expired; sign in again.":"Review holds unavailable for this account.";return;}
  const data=await response.json();
  if(!data.holds?.length){host.textContent="No active review holds.";return;}
  host.innerHTML=data.holds.map((h,i)=>`<article class="card waiting" data-hold-index="${i}"><b>${esc(h.order_id)}</b> · ${esc(h.hold_instance_id)}<br><small>lifecycle ${h.expectation.lifecycle}, attempt ${h.expectation.attempt}, run ${h.expectation.originating_run} · ${esc(h.deadline)}</small>${h.allowed_targets.length?`<div><select class="resume-target">${h.allowed_targets.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select> <button data-decision="resume">Resume</button></div>`:""}<div><button data-decision="commit_pass">Commit pass</button> <button data-decision="commit_fail">Commit fail</button> <button data-decision="abort">Abort</button></div></article>`).join("");
  host.querySelectorAll("[data-decision]").forEach(button=>button.onclick=async()=>{
    const card=button.closest("[data-hold-index]"), hold=data.holds[Number(card.dataset.holdIndex)];
    const decision=button.dataset.decision, target=card.querySelector(".resume-target")?.value;
    const headers={authorization:`Bearer ${productBearer}`,"content-type":"application/json","idempotency-key":crypto.randomUUID()};
    const result=await fetch(`/api/product/orders/${encodeURIComponent(hold.order_id)}/review/holds/${encodeURIComponent(hold.hold_instance_id)}/accept`,{method:"POST",headers,body:JSON.stringify({expected:hold.expectation,decision,target:decision==="resume"?target:null})});
    const body=await result.json().catch(()=>({}));
    const message=document.getElementById("login-error");
    message.textContent=body.progress?`Decision ${body.progress.phase}; operation ${body.receipt.operation_id}`:(result.ok?`Decision accepted; operation ${body.receipt?.operation_id??"unknown"}`:"Decision unavailable; the hold may have changed.");
    await loadProductHolds();
  });
}

async function tick(){
  try {
    const [ords, ver] = await Promise.all([
      fetch("/api/orders?limit=500").then(r=>r.json()),
      fetch("/api/audit/verify").then(r=>r.json()),
    ]);
    document.getElementById("meta").innerHTML =
      `height <b>${ords.height}</b> · head <b>${ords.head_hash.slice(0,10)}…</b> · ${new Date(ords.read_at).toLocaleTimeString()}`;
    const v = document.getElementById("verify");
    v.textContent = ver.chain_valid ? "chain ✓" : "CHAIN BROKEN ✗";
    v.className = ver.chain_valid ? "ok" : "bad";
    const board = document.getElementById("board");
    board.innerHTML = "";
    for (const c of COLS){
      const col = document.createElement("div"); col.className="col";
      const n = ords.counts[c]||0;
      col.innerHTML = `<h2>${LABEL[c]}<span class="n">${n}</span></h2>`;
      for (const card of ords.cards.filter(x=>x.state===c)){
        const d = document.createElement("div");
        d.className = "card "+c;
        d.innerHTML = `<div class="oid">${card.order_id}</div><div class="ev">${esc(card.last_event)}</div>`;
        d.onclick = ()=>openOrder(card.order_id);
        col.appendChild(d);
      }
      board.appendChild(col);
    }
    document.getElementById("banner").style.display="none";
  } catch(e){
    const b=document.getElementById("banner");
    b.textContent = "serve unreachable — retrying every 3s (" + e.message + ")";
    b.style.display="block";
  }
}
async function openOrder(id){
  const d = await fetch("/api/orders/"+encodeURIComponent(id)).then(r=>r.json());
  const body = document.getElementById("dlg-body");
  if (d.journal){
    body.innerHTML = `<h3>${esc(id)} <small style="color:var(--dim)">— ${esc(d.state)} @ height ${d.height}</small></h3>
      <pre>${d.journal.map(j=>`${String(j.seq).padStart(4)} ${j.at}  ${j.from_state} → ${j.to_state}  ${esc(j.event)}  [${esc(j.actor)}]`).join("\n")}</pre>`;
  } else {
    body.innerHTML = `<h3>${esc(id)}</h3><pre>${esc(JSON.stringify(d,null,2))}</pre>`;
  }
  document.getElementById("dlg").showModal();
}
function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }
document.getElementById("dlg").onclick=e=>{ if(e.target.id==="dlg") e.target.close(); };
detectProductMode().then(isProduct=>{ if(!isProduct){tick();setInterval(tick,3000);} }).catch(()=>{tick();setInterval(tick,3000);});
</script>
</body>
</html>
