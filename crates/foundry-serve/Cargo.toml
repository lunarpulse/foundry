[package]
name = "foundry-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
p2-test-support = ["foundry-ledger/p2-test-support", "foundry-line/p2-test-support"]

[dependencies]
foundry-line = { path = "../foundry-line" }
foundry-exec = { path = "../foundry-exec" }
foundry-domain = { path = "../foundry-domain" }
foundry-ledger = { path = "../foundry-ledger" }
tokio.workspace = true
thiserror.workspace = true
axum = "0.8.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
foundry-watch = { version = "0.1.0", path = "../foundry-watch" }
rusqlite = "0.32"
sha2 = "0.10"
hmac = "=0.12.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
