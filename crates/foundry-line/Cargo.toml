[package]
name = "foundry-line"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
p2-test-support = ["foundry-ledger/p2-test-support"]

[dependencies]
foundry-domain = { path = "../foundry-domain" }
foundry-ledger = { path = "../foundry-ledger" }
foundry-furnace = { path = "../foundry-furnace" }
foundry-harness-cli = { path = "../foundry-harness-cli" }
foundry-exec = { path = "../foundry-exec" }
foundry-pack = { path = "../foundry-pack" }
rusqlite = "0.32"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
sha2.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "b1_product_results"
path = "tests/b1_product_results.rs"
required-features = ["p2-test-support"]

[[test]]
name = "b1_product_result_processes"
path = "tests/b1_product_result_processes.rs"
required-features = ["p2-test-support"]
