# triage(verify) 출력 스키마 (r12-4) — verdicts/카테고리/deferred 매핑
[[output]]
name = "verdicts"            # route 조건식이 참조하는 verdict 집합
values = ["patch", "intent_gap", "bad_plan", "defer", "pass"]
from = "categories"          # Review Triage Log의 라우팅 칼럼
active_categories = ["patch", "intent_gap", "bad_plan"]   # findings 스코프
[[output]]
name = "deferred"            # side_records 저널 소스
from = "entries_routed_defer"
schema = "schema-defer.toml"
when = '!any_in(verdicts, ["intent_gap", "bad_plan"])'   # (r13-4) DSL
                             # 로직백 범주 부재 시만 기록(원본 moot 규칙).
                             # 평가 시점: pass emit 커밋 시 1회 — hold·
                             # 재실행 중복 기록 없음.
[[output]]
name = "carried_rows"
from = "triage_log_rows"     # 재런 대조용(원본 carried)
