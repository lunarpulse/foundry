entry = "lenses"
interface_version = 1

[counters]
fix_rounds = 0
loopbacks = 0

[[nodes]]
id = "lenses"
kind = "dispatch"
# (r12-2/r13-2) 원본 렌즈 구성: edge와 claims가 동일 session(trace) =
# 같은 리뷰어가 자신의 추적 "뒤" claims 확인(세션 결속, 순서 아님).
# verif은 독립 렌즈(병렬). triage는 after로 전부 수집.
stages = [
  { id = "edge", lenses = ["lens-edge.md"], role = "lens", session = "trace", output_schema = "schema-findings.toml" },
  { id = "verif", lenses = ["lens-verif.md"], role = "lens", output_schema = "schema-findings.toml" },
  { id = "claims", lenses = ["lens-claims.md"], role = "lens", after = "edge", session = "trace", output_schema = "schema-findings.toml" },
  { id = "triage", lenses = ["lens-triage.md"], role = "verify", after = ["edge", "verif", "claims"], output_schema = "schema-triage.toml" },
]
side_records = ["deferred"]
on_done = "route1"
hold_target = "human"
on_verify_invalid = "hold"
on_no_valid = "hold"

# r11-2: pre_stage는 팩 stages에 등록된다(참조 폐쇄)
[[pack_stages]]
id = "replan-stage"
lenses = ["lens-replan.md"]
role = "replan"

[[pack_stages]]
id = "replan-full-stage"
lenses = ["lens-replan-full.md"]
role = "replan"

[[nodes]]
id = "route1"
kind = "route"
# (r11-1) 원본 cascading: intent_gap/bad_plan 존재 시 loopback — 하위
# 항목은 moot. 상한은 공통 loopbacks 카운터(원본 review_loop_iteration).
# 조건식은 규범 문법 [..] 집합(r11-3).
[[nodes.branches]]
when = 'budget_exhausted() || timeout()'
goto = "human"
[[nodes.branches]]   # (r11-1b) 공통 loopback 상한 — 원본 "loopback 전
when = '(any_in(verdicts, ["intent_gap", "bad_plan"])) && !count_lt(loopbacks, 5)'   # increment, 5 초과 HALT
goto = "human"          # 상한 인간 — replan resume 불가
[[nodes.branches]]   # (r13-6) bump+revert가 hold "전" — 원본 순서:
when = 'any_in(verdicts, ["intent_gap"])'
do = 'bump(loopbacks); revert(origin)'   # increment → 되돌림 → 인간
goto = "human_gap"
[[nodes.branches]]   # (r13-6) bump가 redrive "전" — 원본 순서
when = 'any_in(verdicts, ["bad_plan"]) && count_lt(loopbacks, 5)'
do = 'bump(loopbacks)'
goto = "replan"
[[nodes.branches]]
when = 'any_in(verdicts, ["bad_plan"])'
goto = "human"          # 상한 도달 — loopback 불가(r11-1: patch로 누수 금지)
[[nodes.branches]]
when = 'any_in(verdicts, ["patch"]) && count_lt(fix_rounds, 3)'
goto = "fixdie"
[[nodes.branches]]
when = 'has_findings(any)'
goto = "human"          # patch 상한 등 잔여 — 인간
[[nodes.branches]]
when = '!has_findings(any)'
goto = "pass"           # defer-only: 기록은 side_records(출력 정규화)
[[nodes.branches]]
when = 'true'
goto = "human"

[[nodes]]
id = "fixdie"
kind = "redrive"
target = "die-workdir"
payload = "findings"
base = "latest"
bump = "fix_rounds"
on_done = "lenses"
hold_target = "human"
on_redrive_error = "hold"

[[nodes]]
id = "replan"        # bad_plan: 비동결 부분 수정(원본 step-03 재유도)
kind = "redrive"
target = "die-workdir"
payload = "plan"
base = "origin"
pre_stage = "replan-stage"
on_done = "lenses"
on_redrive_error = "hold"
hold_target = "human"

# (r12-3) intent_gap 전용 hold — 인간이 frozen intent 해결. 인간 응답은
# 불변 artifact(human_resolution)로 저장되어 resume에 결속(§3.3).
[[nodes]]
id = "human_gap"
kind = "hold"
resume_targets = ["replan_full"]

# (r12-3) intent_gap 경로: 코드 되돌림(base=origin) 후 계획 전체 재생성
# (원본 step-02부터) — bad_plan의 비동결 부분 수정(replan)과 다른 계약.
[[nodes]]
id = "replan_full"
kind = "redrive"
target = "die-workdir"
payload = "plan_full"
base = "origin"
pre_stage = "replan-full-stage"
on_done = "lenses"
hold_target = "human"
on_redrive_error = "hold"

[[nodes]]
id = "pass"
kind = "emit"
event = "InspectionPassed"
payload_from = "summary"

[[nodes]]
id = "human"
kind = "hold"
# r11-1/2: 상한·잔여 인간 — fix만 resume 가능(replan 재계획은 human_gap 전용)
resume_targets = ["fixdie"]

[[output.on_error]]
state = "ok"
policy = "accept-stage"

[[output.on_error]]
state = "dispatch_error"
policy = "discard-stage"

[[output.on_error]]
state = "parse_error"
policy = "discard-finding"

[[output.on_error]]
state = "timeout"
policy = "hold"

[hold]
timeout_s = 0
