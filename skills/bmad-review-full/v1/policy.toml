entry = "lenses"
interface_version = 1

[counters]
fix_rounds = 0
replans = 0
loopbacks = 0

[[nodes]]
id = "lenses"
kind = "dispatch"
stages = [
  { id = "edge", lenses = ["lens-edge.md"], role = "lens" },
  { id = "verif", lenses = ["lens-verif.md"], role = "lens", after = "edge", session = "trace" },
  { id = "claims", lenses = ["lens-claims.md"], role = "lens", after = "verif", session = "trace" },
  { id = "triage", lenses = ["lens-triage.md"], role = "verify", after = "claims", session = "trace" },
]
side_records = ["deferred"]
on_done = "route1"
hold_target = "human"
on_verify_invalid = "hold"
on_no_valid = "hold"

# r11-2: pre_stage는 팩 stages에 등록된다(참조 폐쇄)
[[pack_stages]]
id = "replan-stage"
lenses = ["lens-replan.md"]
role = "replan"

[[nodes]]
id = "route1"
kind = "route"
# (r11-1) 원본 cascading: intent_gap/bad_plan 존재 시 loopback — 하위
# 항목은 moot. 상한은 공통 loopbacks 카운터(원본 review_loop_iteration).
# 조건식은 규범 문법 [..] 집합(r11-3).
[[nodes.branches]]
when = 'budget_exhausted() || timeout()'
goto = "human"
[[nodes.branches]]   # (r11-1b) 공통 loopback 상한 — 원본 "loopback 전
when = '(any_in(verdicts, ["intent_gap", "bad_plan"])) && !count_lt(loopbacks, 5)'   # increment, 5 초과 HALT
goto = "human"          # 상한 인간 — replan resume 불가
[[nodes.branches]]
when = 'any_in(verdicts, ["intent_gap"])'
goto = "human_gap"
[[nodes.branches]]
when = 'any_in(verdicts, ["bad_plan"]) && count_lt(loopbacks, 5)'
goto = "replan"
[[nodes.branches]]
when = 'any_in(verdicts, ["bad_plan"])'
goto = "human"          # 상한 도달 — loopback 불가(r11-1: patch로 누수 금지)
[[nodes.branches]]
when = 'any_in(verdicts, ["patch"]) && count_lt(fix_rounds, 3)'
goto = "fixdie"
[[nodes.branches]]
when = 'has_findings(any)'
goto = "human"          # patch 상한 등 잔여 — 인간
[[nodes.branches]]
when = '!has_findings(any)'
goto = "pass"           # defer-only: 기록은 side_records(출력 정규화)
[[nodes.branches]]
when = 'true'
goto = "human"

[[nodes]]
id = "fixdie"
kind = "redrive"
target = "die-workdir"
payload = "findings"
base = "latest"
bump = "fix_rounds"
on_done = "lenses"
hold_target = "human"
on_redrive_error = "hold"

[[nodes]]
id = "replan"
kind = "redrive"
target = "die-workdir"
payload = "plan"
base = "origin"
pre_stage = "replan-stage"
bump = "replans"
on_done = "lenses"
on_redrive_error = "hold"
hold_target = "human"

# r11-2: intent_gap 전용 hold — 해결 후 계획 재실행으로만 resume
[[nodes]]
id = "human_gap"
kind = "hold"
resume_targets = ["replan"]

[[nodes]]
id = "pass"
kind = "emit"
event = "InspectionPassed"
payload_from = "summary"

[[nodes]]
id = "human"
kind = "hold"
# r11-1/2: 상한·잔여 인간 — fix만 resume 가능(replan 재계획은 human_gap 전용)
resume_targets = ["fixdie"]

[[output.on_error]]
state = "ok"
policy = "accept-stage"

[[output.on_error]]
state = "dispatch_error"
policy = "discard-stage"

[[output.on_error]]
state = "parse_error"
policy = "discard-finding"

[[output.on_error]]
state = "timeout"
policy = "hold"

[hold]
timeout_s = 0
