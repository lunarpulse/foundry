[workspace]
resolver = "2"
members = [
    "crates/foundry-domain",
    "crates/foundry-blueprint",
    "crates/foundry-ledger",
    "crates/foundry-furnace",
    "crates/foundry-harness-cli",
    "crates/foundry-line",
    "crates/foundry-inspector",
    "crates/foundry-serve",
    "crates/foundry",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
# 48GB VM disk protection (standing rule 2026-08-29)
incremental = false
